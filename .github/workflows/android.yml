name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v0.1.0-alpha2); empty = build only"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.release || 'ci' }}
  cancel-in-progress: ${{ !inputs.release && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint and debug build
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # The newest push's debug APK, for testers on other machines: a pre-release
      # named ci-latest (Actions artifact storage isn't available on this account).
      - name: Publish the debug APK as ci-latest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA::7}
          cp app/build/outputs/apk/debug/app-debug.apk "sonorium-debug-$short.apk"
          git tag -f ci-latest "$GITHUB_SHA"
          git push -f origin refs/tags/ci-latest
          notes="Debug build (app.sonorium.debug) of ${GITHUB_REF_NAME} at $short: ${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA"
          if gh release view ci-latest >/dev/null 2>&1; then
            gh release edit ci-latest --notes "$notes" --prerelease
            for asset in $(gh release view ci-latest --json assets -q '.assets[].name'); do
              gh release delete-asset ci-latest "$asset" -y
            done
          else
            gh release create ci-latest --verify-tag --prerelease --title "CI build (newest push)" --notes "$notes"
          fi
          gh release upload ci-latest "sonorium-debug-$short.apk" --clobber

      # The engine lab (shared/engine.md), a separate test app; never blocks the Sonorium app.
      # Chaquopy can't use the configuration cache.
      - name: Engine lab APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-configuration-cache :enginelab:assembleDebug
          cp enginelab/build/outputs/apk/debug/enginelab-debug.apk "sonorium-enginelab-${GITHUB_SHA::7}.apk"
          gh release upload ci-latest "sonorium-enginelab-${GITHUB_SHA::7}.apk" --clobber

  device:
    # The app on Android emulators against a real Sonorium server (Docker),
    # end to end: link with a Link App code, load the web UI, find the channel.
    # Results (screenshots, log) go to the e2e-results branch.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Android: the end-to-end test, then screenshots on every screen profile.
          - api: 35
            screens: 1
            results: e2e-results
          # The oldest Android the app supports (8.0), with its old built-in WebView:
          # the end-to-end test only. Old phones make good remotes.
          - api: 26
            screens: 0
            results: e2e-results-android8
    env:
      SERVER_IMAGE: ghcr.io/synssins/sonorium:dev
      SCREENS: ${{ matrix.screens }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start a Sonorium server
        run: |
          docker run -d --name sonorium -p 8008:8008 -p 8808:8808 "$SERVER_IMAGE"
          python3 e2e/server_setup.py https://127.0.0.1:8808 10.0.2.2 >> "$GITHUB_ENV"

      - name: Build the app and its device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run on the emulator
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./e2e/run_device_test.sh

      - name: What the server saw
        if: always()
        run: |
          mkdir -p e2e-out
          {
            echo "## Device test, Android API ${{ matrix.api }}: ${{ steps.device.outcome }}"
            echo
            echo "Server: $(curl -sk https://127.0.0.1:8808/api/info | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")"
            echo
            python3 e2e/server_check.py https://127.0.0.1:8808 "$CI_ADMIN" "$CI_PASSWORD" || echo "No phone linked."
            echo
            echo '### Instrumentation'
            echo '```'
            tail -40 e2e-out/instrumentation.txt 2>/dev/null
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > e2e-out/summary.md
          docker logs sonorium > e2e-out/server.log 2>&1 || true

      - name: Publish results to the e2e-results branch
        if: always()
        run: |
          dir=$(mktemp -d)
          cp -r e2e-out/. "$dir/"
          cd "$dir"
          git init -q -b e2e-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${GITHUB_SHA::7})" > RUN.txt
          git add -A
          git commit -qm "Device test results for ${GITHUB_SHA::7}"
          git branch -m "${{ matrix.results }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ matrix.results }}"

  release:
    # A tag such as v0.1.0, or a manual run with "release" set, builds a signed
    # APK and publishes it as a GitHub release (creating the tag if needed).
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SONORIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SONORIUM_KEYSTORE_BASE64 secret is missing; see README (Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release
        env:
          SONORIUM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SONORIUM_KEYSTORE_PASSWORD: ${{ secrets.SONORIUM_KEYSTORE_PASSWORD }}
          SONORIUM_KEY_ALIAS: ${{ secrets.SONORIUM_KEY_ALIAS }}
          SONORIUM_KEY_PASSWORD: ${{ secrets.SONORIUM_KEY_PASSWORD }}
          SONORIUM_VERSION_NAME: ${{ env.TAG }}
          SONORIUM_VERSION_CODE: ${{ github.run_number }}
        run: |
          export SONORIUM_VERSION_NAME="${SONORIUM_VERSION_NAME#v}"
          ./gradlew --stacktrace :app:assembleRelease :app:bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "sonorium-${SONORIUM_VERSION_NAME}.apk"
          # The bundle for Google Play (same signature: the upload key)
          cp app/build/outputs/bundle/release/app-release.aab "sonorium-${SONORIUM_VERSION_NAME}.aab"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs "sonorium-${SONORIUM_VERSION_NAME}.apk" | grep -i sha-256 || true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag with git first (a plain push works where the API may refuse to create tags),
          # then make the release from that tag.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" sonorium-*.apk sonorium-*.aab --verify-tag \
            --title "Sonorium $TAG" --notes-file .github/release-notes.md \
            $([[ "$TAG" == *-* ]] && echo --prerelease) || {
              echo "::group::What this token may do"
              gh api "repos/$GITHUB_REPOSITORY" --jq '{visibility, permissions}' || true
              echo "::endgroup::"
              exit 1
            }
