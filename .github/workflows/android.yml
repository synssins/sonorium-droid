name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint and debug build
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug

  release:
    # A tag such as v0.1.0 builds a signed APK and publishes it as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SONORIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SONORIUM_KEYSTORE_BASE64 secret is missing; see README (Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release
        env:
          SONORIUM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SONORIUM_KEYSTORE_PASSWORD: ${{ secrets.SONORIUM_KEYSTORE_PASSWORD }}
          SONORIUM_KEY_ALIAS: ${{ secrets.SONORIUM_KEY_ALIAS }}
          SONORIUM_KEY_PASSWORD: ${{ secrets.SONORIUM_KEY_PASSWORD }}
          SONORIUM_VERSION_NAME: ${{ github.ref_name }}
          SONORIUM_VERSION_CODE: ${{ github.run_number }}
        run: |
          export SONORIUM_VERSION_NAME="${SONORIUM_VERSION_NAME#v}"
          ./gradlew --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "sonorium-${SONORIUM_VERSION_NAME}.apk"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs "sonorium-${SONORIUM_VERSION_NAME}.apk" | grep -i sha-256 || true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" sonorium-*.apk \
            --title "Sonorium ${{ github.ref_name }}" --generate-notes \
            $([[ "${{ github.ref_name }}" == *-* ]] && echo --prerelease)
